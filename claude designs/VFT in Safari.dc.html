<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  sizerRef = React.createRef();
  componentDidMount() {
    this.fit = () => {
      const el = this.sizerRef.current;
      if (!el) return;
      const s = Math.min(el.clientHeight / 852, el.clientWidth / 393) || 1;
      el.style.setProperty("--phone-scale", String(s));
    };
    this.ro = new ResizeObserver(this.fit);
    this.ro.observe(this.sizerRef.current);
    this.fit();
  }
  componentWillUnmount() { if (this.ro) this.ro.disconnect(); }
  renderVals() { return { sizerRef: this.sizerRef }; }
}
</script>
